<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Shapegram</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bubble-sent: #667eea;
            --bubble-received: #ffffff;
            --bg-color: #fafafa;
            --border: 1px solid #dbdbdb;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--primary-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .page-wrapper {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            height: 90vh;
        }

        /* Sidebar Navigation */
        .nav-sidebar {
            width: 70px;
            background: white;
            border-radius: var(--radius);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .nav-icon {
            font-size: 28px;
            text-decoration: none;
            color: #8e8e8e;
            padding: 10px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .nav-icon:hover { background: #f0f0f0; transform: scale(1.1); }
        .nav-icon.active { color: #667eea; background: rgba(102, 126, 234, 0.1); }

        /* Main Chat Interface */
        .chat-container {
            flex: 1;
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        /* Message List (Left) */
        .conversations-list {
            width: 320px;
            border-right: var(--border);
            display: flex;
            flex-direction: column;
        }

        .list-header {
            padding: 20px;
            border-bottom: var(--border);
            font-weight: 700;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }

        .convo-item {
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f5f5f5;
        }

        .convo-item:hover { background: #fafafa; }
        .convo-item.active { background: #f0f4f8; border-left: 4px solid #667eea; }

        .convo-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #eee;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .convo-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .convo-details { flex: 1; overflow: hidden; }
        .convo-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .convo-msg { font-size: 13px; color: #8e8e8e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread { color: #262626; font-weight: 600; }

        /* Active Chat Area (Right) */
        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fdfdfd;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: var(--border);
            background: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot { width: 10px; height: 10px; background: #43e97b; border-radius: 50%; display: inline-block; margin-right: 5px; }

        .messages-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .msg-received {
            align-self: flex-start;
            background: var(--bubble-received);
            border: 1px solid #efefef;
            border-bottom-left-radius: 4px;
        }

        .msg-sent {
            align-self: flex-end;
            background: var(--primary-gradient);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: var(--border);
            display: flex;
            gap: 15px;
        }

        .msg-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.2s;
        }
        .msg-input:focus { border-color: #667eea; }

        .send-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover { transform: scale(1.1); }

        @media (max-width: 768px) {
            .page-wrapper { flex-direction: column; height: 100vh; gap: 0; padding: 0; max-width: 100%; }
            body { padding: 0; }
            .nav-sidebar { width: 100%; flex-direction: row; justify-content: space-around; padding: 10px; border-radius: 0; order: 2; }
            .chat-container { border-radius: 0; order: 1; }
            .conversations-list { width: 100px; } /* Compact mode */
            .convo-name, .convo-msg { display: none; }
            .convo-item { padding: 15px 10px; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <nav class="nav-sidebar">
            <div id="sidebarLogo" style="width:40px;height:40px;border-radius:50%;overflow:hidden;">📷</div>
            <a href="index.html" class="nav-icon" aria-label="Home">🏠</a>
            <a href="messages.html" class="nav-icon active" aria-label="Messages">💬</a>
            <a href="profile.html" class="nav-icon" aria-label="Profile">👤</a>
        </nav>

        <main class="chat-container">
            <aside class="conversations-list" id="convoList">
                <div class="list-header">Chats <span>✏️</span></div>
                </aside>

            <section class="chat-view" id="chatView">
                <div style="flex:1; display:flex; align-items:center; justify-content:center; color:#ccc; flex-direction:column;">
                    <div style="font-size:50px;margin-bottom:10px;">💬</div>
                    Select a conversation
                </div>
            </section>
        </main>
    </div>

    <script>
        const MessagesState = {
            data: {
                logo: null,
                square: null,
                rectangle: null,
                rhombus: null,
                trapezoid: null
            },
            
            init() {
                const saved = localStorage.getItem('shapegram_messages_config');
                if(saved) this.data = { ...this.data, ...JSON.parse(saved) };
                
                if (typeof IMAGES_CONFIG_MESSAGES !== 'undefined') {
                    this.data = { ...this.data, ...IMAGES_CONFIG_MESSAGES };
                }

                if(this.data.logo) document.getElementById('sidebarLogo').innerHTML = `<img src="${this.data.logo}" style="width:100%">`;
                this.renderList();
            },

            renderList() {
                const list = document.getElementById('convoList');
                // Keep header
                const header = list.firstElementChild;
                list.innerHTML = '';
                list.appendChild(header);

                const chats = [
                    { id: 'square', name: 'Square', msg: 'All sides equal! ✨', time: '2m', unread: true },
                    { id: 'rectangle', name: 'Rectangle', msg: 'Lunch?', time: '1h', unread: false },
                    { id: 'rhombus', name: 'Rhombus', msg: 'Look at this angle', time: '3h', unread: true },
                    { id: 'trapezoid', name: 'Trapezoid', msg: 'Parallel lines...', time: '5h', unread: false }
                ];

                const frag = document.createDocumentFragment();

                chats.forEach(chat => {
                    const div = document.createElement('div');
                    div.className = 'convo-item';
                    div.innerHTML = `
                        <div class="convo-avatar">
                            ${this.data[chat.id] ? `<img src="${this.data[chat.id]}">` : '👤'}
                        </div>
                        <div class="convo-details">
                            <div class="convo-name">${chat.name}</div>
                            <div class="convo-msg ${chat.unread ? 'unread' : ''}">${chat.msg}</div>
                        </div>
                    `;
                    div.onclick = () => {
                        document.querySelectorAll('.convo-item').forEach(e => e.classList.remove('active'));
                        div.classList.add('active');
                        this.openChat(chat);
                    };
                    frag.appendChild(div);
                });
                list.appendChild(frag);
            },

            openChat(chat) {
                const view = document.getElementById('chatView');
                const avatar = this.data[chat.id] ? `<img src="${this.data[chat.id]}" style="width:100%;height:100%;object-fit:cover;">` : '👤';
                
                view.innerHTML = `
                    <div class="chat-header">
                        <div class="convo-avatar" style="width:40px;height:40px;">${avatar}</div>
                        <div>
                            <div style="font-weight:600">${chat.name}</div>
                            <div style="font-size:12px;color:#888;"><span class="status-dot"></span>Active Now</div>
                        </div>
                    </div>
                    <div class="messages-scroll" id="scrollArea">
                        <div class="msg-bubble msg-received">${chat.msg}</div>
                    </div>
                    <div class="input-area">
                        <input type="text" class="msg-input" id="msgInput" placeholder="Type a message...">
                        <button class="send-btn" onclick="MessagesState.send()">➤</button>
                    </div>
                `;

                // Bind Enter key
                const input = document.getElementById('msgInput');
                input.focus();
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') MessagesState.send();
                });
            },

            send() {
                const input = document.getElementById('msgInput');
                const text = input.value.trim();
                if(!text) return;

                const scroll = document.getElementById('scrollArea');
                const div = document.createElement('div');
                div.className = 'msg-bubble msg-sent';
                div.textContent = text;
                scroll.appendChild(div);
                
                input.value = '';
                scroll.scrollTop = scroll.scrollHeight; // Auto scroll to bottom
            }
        };

        document.addEventListener('DOMContentLoaded', () => MessagesState.init());
    </script>
    <script src="images-config-messages.js"></script>
</body>
</html>
