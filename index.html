<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shapegram AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chosen Palette: Modern Social (White/Gray/Blue) -->
    <style>
        /* Custom Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Story Gradient Ring */
        .story-ring {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2px;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans h-screen flex flex-col overflow-hidden max-w-md mx-auto shadow-2xl relative">

    <!-- Application Structure Plan:
         1. Header: Dynamic based on current view (Home/Messages/Profile).
         2. Main Content Area: Scrollable container switching between Feed, Inbox/Chat, and Profile views.
         3. Bottom Navigation: Persistent tab bar for navigation.
         4. AI Modals/Overlays: Smart reply strip in chat, AI Generator modal in profile.
    -->

    <!-- DYNAMIC HEADER -->
    <header id="app-header" class="h-14 bg-white border-b flex items-center justify-between px-4 shrink-0 z-20">
        <!-- Content injected by JS -->
    </header>

    <!-- MAIN CONTENT VIEWS -->
    <main id="main-container" class="flex-1 overflow-y-auto bg-white relative no-scrollbar">
        
        <!-- VIEW 1: HOME FEED -->
        <div id="view-home" class="view-section">
            <!-- Stories -->
            <div class="flex gap-4 p-4 overflow-x-auto no-scrollbar border-b border-gray-100" id="stories-container">
                <!-- Stories injected JS -->
            </div>
            <!-- Feed Posts -->
            <div id="feed-container" class="pb-4">
                <!-- Posts injected JS -->
            </div>
        </div>

        <!-- VIEW 2: MESSAGES (Inbox & Chat) -->
        <div id="view-messages" class="view-section hidden h-full flex flex-col">
            
            <!-- Sub-view: Inbox List -->
            <div id="inbox-list" class="flex-1 overflow-y-auto">
                <div class="px-4 py-3">
                    <div class="bg-gray-100 rounded-lg flex items-center px-3 py-2">
                        <i class="fas fa-search text-gray-400 mr-2"></i>
                        <input type="text" placeholder="Search" class="bg-transparent w-full outline-none text-sm">
                    </div>
                </div>
                <div id="chat-list-container">
                    <!-- Chat items injected JS -->
                </div>
            </div>

            <!-- Sub-view: Active Chat (Hidden by default) -->
            <div id="active-chat" class="hidden absolute top-0 left-0 w-full h-full bg-white flex flex-col z-30 slide-up">
                <!-- Chat Header -->
                <div class="h-14 border-b flex items-center justify-between px-4 bg-white shrink-0">
                    <div class="flex items-center gap-3">
                        <button onclick="closeChat()" class="text-gray-800"><i class="fas fa-arrow-left text-xl"></i></button>
                        <div class="flex items-center gap-2">
                            <img id="chat-avatar" src="" class="w-8 h-8 rounded-full border">
                            <span id="chat-name" class="font-bold text-sm">User</span>
                        </div>
                    </div>
                    <button class="text-gray-600"><i class="fas fa-info-circle"></i></button>
                </div>
                
                <!-- Chat Messages -->
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
                    <!-- Messages injected JS -->
                </div>

                <!-- AI Smart Replies -->
                <div id="ai-replies-strip" class="hidden px-4 py-2 gap-2 overflow-x-auto bg-blue-50 border-t border-blue-100 whitespace-nowrap no-scrollbar shrink-0">
                    <!-- Chips injected JS -->
                </div>

                <!-- Input Area -->
                <div class="p-3 border-t bg-white shrink-0 flex items-center gap-2">
                    <div class="bg-gray-100 rounded-full flex-1 px-4 py-2">
                        <input type="text" id="msg-input" placeholder="Message..." class="bg-transparent w-full outline-none text-sm">
                    </div>
                    <button onclick="sendMessage()" class="text-blue-500 font-semibold text-sm px-2">Send</button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: PROFILE -->
        <div id="view-profile" class="view-section hidden">
            <div class="px-4 pt-4 pb-2">
                <div class="flex items-center justify-between mb-4">
                    <div class="relative">
                        <div class="story-ring p-[2px]">
                            <img src="https://ui-avatars.com/api/?name=You&background=random" class="w-20 h-20 rounded-full border-2 border-white">
                        </div>
                        <button class="absolute bottom-0 right-0 bg-blue-500 text-white rounded-full w-6 h-6 flex items-center justify-center border-2 border-white text-xs">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <div class="flex flex-1 justify-around text-center ml-4">
                        <div><div class="font-bold text-lg">12</div><div class="text-xs text-gray-500">Posts</div></div>
                        <div><div class="font-bold text-lg">4.2k</div><div class="text-xs text-gray-500">Followers</div></div>
                        <div><div class="font-bold text-lg">340</div><div class="text-xs text-gray-500">Following</div></div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <h2 class="font-bold">Shapegram Creator</h2>
                    <p class="text-sm text-gray-600">Digital Artist & AI Enthusiast 🎨<br>Sharing the beauty of geometry.</p>
                </div>

                <!-- AI Feature Button -->
                <button onclick="openAiGenerator()" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-2 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform mb-4">
                    <i class="fas fa-magic mr-2"></i> Generate AI Post
                </button>
            </div>

            <!-- Profile Grid -->
            <div id="profile-grid" class="grid grid-cols-3 gap-0.5 pb-16">
                <!-- Grid items injected JS -->
            </div>
        </div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="h-14 bg-white border-t flex justify-around items-center shrink-0 z-20 text-2xl text-gray-400">
        <button onclick="switchView('home')" class="nav-btn text-black" data-target="home"><i class="fas fa-home"></i></button>
        <button class="nav-btn hover:text-gray-600"><i class="fas fa-search"></i></button>
        <button class="nav-btn hover:text-gray-600"><i class="far fa-plus-square"></i></button>
        <button onclick="switchView('messages')" class="nav-btn hover:text-gray-600 relative" data-target="messages">
            <i class="fab fa-facebook-messenger"></i>
            <div class="absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></div>
        </button>
        <button onclick="switchView('profile')" class="nav-btn hover:text-gray-600" data-target="profile">
            <img src="https://ui-avatars.com/api/?name=You&background=random" class="w-6 h-6 rounded-full border border-gray-200">
        </button>
    </nav>

    <!-- AI GENERATOR MODAL (Hidden) -->
    <div id="ai-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 text-center shadow-2xl animate-fade-in">
            <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fas fa-magic"></i>
            </div>
            <h3 class="text-xl font-bold mb-2">AI Image Generator</h3>
            <p class="text-gray-500 text-sm mb-4">Describe what you want to create.</p>
            <input type="text" id="ai-prompt" placeholder="e.g. Neon geometric cat..." class="w-full bg-gray-100 border-none rounded-lg px-4 py-3 mb-4 outline-none focus:ring-2 ring-purple-500">
            <div class="flex gap-2">
                <button onclick="closeAiGenerator()" class="flex-1 py-2 text-gray-500 font-semibold hover:bg-gray-100 rounded-lg">Cancel</button>
                <button onclick="runAiGeneration()" class="flex-1 py-2 bg-purple-600 text-white font-semibold rounded-lg shadow-lg hover:bg-purple-700">Generate</button>
            </div>
        </div>
    </div>

    <!-- DATA & LOGIC -->
    <script>
        // --- 1. MOCK DATA (Replaces external JS files) ---
        const currentUser = { name: "Shapegram Creator", handle: "@shape_gram" };
        
        const feedData = [
            { id: 1, user: "alex_designs", avatar: "https://ui-avatars.com/api/?name=Alex&bg=random", img: "https://picsum.photos/400/400?random=1", likes: 120, caption: "Love the new shapes! 🔷" },
            { id: 2, user: "geometry_fan", avatar: "https://ui-avatars.com/api/?name=Geo&bg=random", img: "https://picsum.photos/400/400?random=2", likes: 85, caption: "Minimalist vibes today. #art" },
            { id: 3, user: "ui_guru", avatar: "https://ui-avatars.com/api/?name=UI&bg=random", img: "https://picsum.photos/400/400?random=3", likes: 200, caption: "Working on a new project." }
        ];

        const chatData = [
            { id: 1, name: "Sarah Chen", avatar: "https://ui-avatars.com/api/?name=Sarah&bg=E91E63&color=fff", lastMsg: "Did you see the new update?", time: "2m", unread: true },
            { id: 2, name: "Mike Ross", avatar: "https://ui-avatars.com/api/?name=Mike&bg=2196F3&color=fff", lastMsg: "Sent an attachment 📎", time: "1h", unread: false },
            { id: 3, name: "Design Team", avatar: "https://ui-avatars.com/api/?name=DT&bg=4CAF50&color=fff", lastMsg: "Meeting at 3 PM.", time: "4h", unread: false }
        ];

        let profileImages = [
            "https://picsum.photos/400/400?random=10",
            "https://picsum.photos/400/400?random=11",
            "https://picsum.photos/400/400?random=12",
            "https://picsum.photos/400/400?random=13",
            "https://picsum.photos/400/400?random=14",
            "https://picsum.photos/400/400?random=15"
        ];

        // --- 2. VIEW NAVIGATION LOGIC ---
        function switchView(viewName) {
            // Hide all views
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            // Show target view
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
            
            // Update Navigation Icons
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('text-black', 'text-gray-400'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.add('text-gray-400'));
            
            const activeBtn = document.querySelector(`.nav-btn[data-target="${viewName}"]`);
            if (activeBtn) {
                activeBtn.classList.remove('text-gray-400');
                activeBtn.classList.add('text-black');
            }

            // Update Header Based on View
            updateHeader(viewName);
        }

        function updateHeader(viewName) {
            const header = document.getElementById('app-header');
            if (viewName === 'home') {
                header.innerHTML = `
                    <div class="font-bold text-xl tracking-tight font-serif italic">Shapegram</div>
                    <div class="flex gap-4">
                        <i class="far fa-heart text-xl"></i>
                        <div class="relative">
                            <i class="far fa-paper-plane text-xl transform -rotate-12" onclick="switchView('messages')"></i>
                            <div class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></div>
                        </div>
                    </div>`;
            } else if (viewName === 'messages') {
                header.innerHTML = `
                    <div class="flex items-center gap-2 font-bold text-lg">
                        <span>${currentUser.name}</span> <i class="fas fa-chevron-down text-xs"></i>
                    </div>
                    <i class="far fa-edit text-xl"></i>`;
            } else if (viewName === 'profile') {
                header.innerHTML = `
                    <div class="font-bold text-lg">${currentUser.handle}</div>
                    <div class="flex gap-4">
                        <i class="far fa-plus-square text-xl"></i>
                        <i class="fas fa-bars text-xl"></i>
                    </div>`;
            }
        }

        // --- 3. RENDERING FUNCTIONS ---
        function initApp() {
            renderFeed();
            renderStories();
            renderInbox();
            renderProfileGrid();
            switchView('home'); // Default view
        }

        function renderStories() {
            const container = document.getElementById('stories-container');
            // Mock stories
            for(let i=0; i<6; i++) {
                container.innerHTML += `
                    <div class="flex flex-col items-center gap-1 min-w-[70px]">
                        <div class="story-ring p-[2px]">
                            <div class="bg-white p-[2px] rounded-full">
                                <img src="https://ui-avatars.com/api/?name=User+${i}&bg=random" class="w-14 h-14 rounded-full border border-gray-100">
                            </div>
                        </div>
                        <span class="text-xs truncate w-full text-center">User ${i}</span>
                    </div>`;
            }
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            feedData.forEach(post => {
                container.innerHTML += `
                    <div class="bg-white mb-2 pb-2">
                        <div class="flex items-center justify-between p-3">
                            <div class="flex items-center gap-2">
                                <img src="${post.avatar}" class="w-8 h-8 rounded-full border">
                                <span class="font-bold text-sm">${post.user}</span>
                            </div>
                            <i class="fas fa-ellipsis-h text-gray-500"></i>
                        </div>
                        <img src="${post.img}" class="w-full aspect-square object-cover bg-gray-100">
                        <div class="p-3">
                            <div class="flex justify-between text-2xl mb-2">
                                <div class="flex gap-4">
                                    <i class="far fa-heart hover:text-red-500 cursor-pointer"></i>
                                    <i class="far fa-comment"></i>
                                    <i class="far fa-paper-plane"></i>
                                </div>
                                <i class="far fa-bookmark"></i>
                            </div>
                            <div class="font-bold text-sm mb-1">${post.likes} likes</div>
                            <div class="text-sm"><span class="font-bold">${post.user}</span> ${post.caption}</div>
                        </div>
                    </div>`;
            });
        }

        function renderInbox() {
            const container = document.getElementById('chat-list-container');
            container.innerHTML = '';
            chatData.forEach(chat => {
                container.innerHTML += `
                    <div onclick="openChat('${chat.name}', '${chat.avatar}')" class="flex items-center px-4 py-3 hover:bg-gray-50 cursor-pointer">
                        <div class="relative">
                            <img src="${chat.avatar}" class="w-14 h-14 rounded-full border">
                            ${chat.unread ? '<div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-blue-500 border-2 border-white rounded-full"></div>' : ''}
                        </div>
                        <div class="ml-3 flex-1">
                            <div class="flex justify-between items-baseline">
                                <span class="font-semibold text-sm">${chat.name}</span>
                                <span class="text-xs text-gray-400">${chat.time}</span>
                            </div>
                            <p class="text-sm ${chat.unread?'font-semibold text-gray-900':'text-gray-500'} truncate">${chat.lastMsg}</p>
                        </div>
                        <button class="ml-2 text-gray-400"><i class="fas fa-camera"></i></button>
                    </div>`;
            });
        }

        function renderProfileGrid() {
            const container = document.getElementById('profile-grid');
            container.innerHTML = '';
            profileImages.forEach(src => {
                container.innerHTML += `<img src="${src}" class="w-full aspect-square object-cover hover:opacity-90 cursor-pointer border border-white">`;
            });
        }

        // --- 4. CHAT & AI SMART REPLIES ---
        function openChat(name, avatar) {
            document.getElementById('chat-name').textContent = name;
            document.getElementById('chat-avatar').src = avatar;
            
            // Clear previous messages
            const msgContainer = document.getElementById('chat-messages');
            msgContainer.innerHTML = `
                <div class="text-center py-6 text-gray-400 text-xs">
                    Today
                </div>
                <div class="flex justify-start">
                    <div class="bg-white border text-gray-800 px-4 py-2 rounded-2xl rounded-tl-sm max-w-[70%] text-sm shadow-sm">
                        Hey! Have you tried the new AI feature? 🤖
                    </div>
                </div>`;
            
            // Show Chat View
            document.getElementById('active-chat').classList.remove('hidden');
            document.getElementById('app-header').classList.add('hidden'); // Hide main header
            
            // Trigger AI Suggestions
            setTimeout(() => generateSmartReplies("Hey! Have you tried the new AI feature? 🤖"), 600);
        }

        function closeChat() {
            document.getElementById('active-chat').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('ai-replies-strip').classList.add('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;
            
            // Add Message
            const container = document.getElementById('chat-messages');
            container.innerHTML += `
                <div class="flex justify-end fade-in">
                    <div class="bg-blue-500 text-white px-4 py-2 rounded-2xl rounded-tr-sm max-w-[70%] text-sm">
                        ${text}
                    </div>
                </div>`;
            container.scrollTop = container.scrollHeight;
            input.value = '';
            
            // Hide AI suggestions
            document.getElementById('ai-replies-strip').classList.add('hidden');
            document.getElementById('ai-replies-strip').classList.remove('flex');
        }

        // --- CORE AI LOGIC: SMART REPLIES ---
        function generateSmartReplies(text) {
            const strip = document.getElementById('ai-replies-strip');
            const lower = text.toLowerCase();
            
            let suggestions = ["Cool!", "Tell me more", "Not yet"];
            
            // Basic Context Awareness
            if(lower.includes('feature') || lower.includes('ai')) {
                suggestions = ["Is it good?", "Show me!", "How do I use it?"];
            } else if(lower.includes('meeting') || lower.includes('time')) {
                suggestions = ["I'll be there", "Can we reschedule?", "What time?"];
            } else if(lower.includes('photo')) {
                suggestions = ["Nice pic! 📸", "Send it", "Wow"];
            }

            // Render Chips
            strip.innerHTML = '<div class="flex items-center text-purple-500 mr-2 text-xs"><i class="fas fa-sparkles"></i></div>';
            suggestions.forEach(reply => {
                const btn = document.createElement('button');
                btn.className = "px-3 py-1 bg-white border border-purple-200 text-purple-600 rounded-full text-xs font-semibold shadow-sm active:scale-95 transition";
                btn.textContent = reply;
                btn.onclick = () => {
                    document.getElementById('msg-input').value = reply;
                    document.getElementById('msg-input').focus();
                    strip.classList.add('hidden');
                    strip.classList.remove('flex');
                };
                strip.appendChild(btn);
            });

            strip.classList.remove('hidden');
            strip.classList.add('flex');
        }

        // --- CORE AI LOGIC: IMAGE GENERATOR ---
        function openAiGenerator() {
            document.getElementById('ai-modal').classList.remove('hidden');
        }
        
        function closeAiGenerator() {
            document.getElementById('ai-modal').classList.add('hidden');
        }

        function runAiGeneration() {
            const btn = document.querySelector('#ai-modal button:last-child');
            const originalText = btn.textContent;
            
            // 1. Loading State
            btn.textContent = "Generating...";
            btn.disabled = true;
            btn.classList.add('opacity-70');

            // 2. Simulate API Call (2 seconds)
            setTimeout(() => {
                // 3. Add new image to Profile
                const newImage = `https://picsum.photos/400/400?random=${Date.now()}`;
                profileImages.unshift(newImage);
                renderProfileGrid();

                // 4. Reset & Close
                btn.textContent = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                closeAiGenerator();
                
                // 5. Feedback
                alert("✨ Magic! New post generated and added to your profile.");
            }, 2000);
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
